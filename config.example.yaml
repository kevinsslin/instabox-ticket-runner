# Copy outside the checkout. These are settings and Secret names, never values.
user: your-profile
org: your-workspace-id
provider: codex
repo: owner/private-repo
base: main
vcpus: 2
mem_mib: 4096
# Optional, only a clean tool/dependency snapshot owned by your workspace:
# snapshot: your-clean-base
# Select existing org Secrets explicitly for private GitHub access:
secrets: []
# secrets: [GH_TOKEN]
# Default desktop store. For a headless bot host, see docs/deployment.md:
credential_backend: native
# credential_backend: encrypted-file
# credential_key_file: /run/credentials/ib-ticket.service/master.key
