name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o bin/ib-ticket .
      - run: sh skills/instabox-ticket/scripts/run.sh --help
      - run: ./bin/ib-ticket --version
      - name: Native macOS credential store (synthetic data only)
        if: runner.os == 'macOS'
        run: IB_TICKET_TEST_OS_STORE=1 go test -run '^TestNativeCredentialStoreRoundTrip$' -v .
      - name: Native Linux credential store (isolated, synthetic data only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gnome-keyring dbus-x11
          export XDG_DATA_HOME="$(mktemp -d)"
          dbus-run-session -- sh -ec '
            printf "audit-only" | gnome-keyring-daemon --unlock --components=secrets
            IB_TICKET_TEST_OS_STORE=1 go test -run "^TestNativeCredentialStoreRoundTrip$" -v .
          '
      - name: Dependency vulnerability scan
        run: |
          GOBIN="$RUNNER_TEMP/audit-bin" go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          GOTOOLCHAIN=local "$RUNNER_TEMP/audit-bin/govulncheck" ./...
